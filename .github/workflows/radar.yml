name: Power Electronics Radar

on:
  schedule:
    # 每天北京时间 08:00 运行
    - cron: "0 0 * * *"

  workflow_dispatch:

  # 修改雷达程序后自动生成一份新数据，避免必须手动点击 Actions。
  push:
    paths:
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Fix prompt template
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/radar.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("prompt = f'''", "prompt = '''", 1)
          needle = "    r = requests.post("
          patch = "    prompt = prompt.replace('{date}', date).replace('{json.dumps(events, ensure_ascii=False)}', json.dumps(events, ensure_ascii=False))\n\n"
          if patch not in s:
              s = s.replace(needle, patch + needle, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/radar.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git diff --cached --quiet || git commit -m "Update power electronics radar"
          git pull --rebase origin main
          git push
