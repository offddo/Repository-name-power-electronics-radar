name: Power Electronics Radar

on:
  schedule:
    # 每天北京时间 08:00 运行
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Fix prompt template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/radar.py")
          text = path.read_text(encoding="utf-8")

          if "prompt = f'''" not in text:
              raise SystemExit("Expected prompt template not found; refusing to continue")

          text = text.replace("    prompt = f'''", "    prompt = '''", 1)
          text = text.replace("报告日期：{date}", "报告日期：DATE_PLACEHOLDER", 1)
          text = text.replace("{json.dumps(events, ensure_ascii=False)}'''", "EVENTS_PLACEHOLDER'''", 1)

          marker = "EVENTS_PLACEHOLDER'''\n\n    r = requests.post"
          replacement = (
              "EVENTS_PLACEHOLDER'''\n"
              "    prompt = prompt.replace(\"DATE_PLACEHOLDER\", date).replace(\n"
              "        \"EVENTS_PLACEHOLDER\", json.dumps(events, ensure_ascii=False)\n"
              "    )\n\n    r = requests.post"
          )
          if marker not in text:
              raise SystemExit("Prompt template closing marker not found; refusing to continue")

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/radar.py

      - name: Validate AI output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          note = data.get("quality_notes", "")
          if "AI结构化分析失败" in note:
              raise SystemExit("DeepSeek structured analysis failed; refusing to publish fallback data")
          print(f"Validated {data.get('event_count', 0)} events")
          PY

      - name: Commit results safely
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 保存本次生成的数据。运行期间如果 main 有新提交，先同步最新 main，
          # 再把刚生成的 data.json 放回去，避免 pull/rebase 与未提交文件冲突。
          cp data.json /tmp/radar-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar-data.json data.json

          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update power electronics radar"
          git push origin main
