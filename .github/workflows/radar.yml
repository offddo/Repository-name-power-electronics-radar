name: Power Electronics Radar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/radar.py"
      - "scripts/radar_runner.py"
      - "scripts/postprocess.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/radar.py")
          s = p.read_text(encoding="utf-8")
          # Safely convert the JSON-bearing prompt f-string to a normal template.
          s = s.replace("    prompt = f'''", "    prompt = '''", 1)
          s = s.replace("报告日期：{date}", "报告日期：DATE_PLACEHOLDER", 1)
          s = s.replace("{json.dumps(events, ensure_ascii=False)}'''", "EVENTS_PLACEHOLDER'''", 1)
          s = s.replace(
              "    r = requests.post(",
              "    prompt = prompt.replace('DATE_PLACEHOLDER', date).replace('EVENTS_PLACEHOLDER', json.dumps(events, ensure_ascii=False))\n\n    r = requests.post(",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY
          python scripts/radar_runner.py
          python scripts/postprocess.py

      - name: Clean and validate AI output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = ("原文未提供", "暂无数据", "N/A", "n/a")
          allowed_types = {"国内资讯", "国内论文", "国际资讯", "国际论文"}

          def clean(v):
              if isinstance(v, dict):
                  out = {}
                  for k, x in v.items():
                      if k == "unknowns":
                          continue
                      x = clean(x)
                      if x in (None, [], {}, ""):
                          continue
                      if isinstance(x, str) and any(token in x for token in forbidden):
                          continue
                      out[k] = x
                  return out
              if isinstance(v, list):
                  cleaned = []
                  for x in v:
                      x = clean(x)
                      if x in (None, [], {}, ""):
                          continue
                      if isinstance(x, str) and any(token in x for token in forbidden):
                          continue
                      cleaned.append(x)
                  return cleaned
              return v

          data = clean(data)
          for e in data.get("events", []):
              sources = e.get("sources") or []
              if e.get("link") and not any(isinstance(s, dict) and s.get("link") == e.get("link") for s in sources):
                  sources.insert(0, {"source": e.get("primary_source", "原始来源"), "title": e.get("title", ""), "link": e["link"]})
              e["sources"] = sources
              if e.get("source_type") not in allowed_types:
                  e["source_type"] = "国内资讯" if any(x in str(e.get("primary_source", "")) for x in ["中国", "电力电子技术", "电力自动化设备", "电力系统自动化", "电工技术学报", "中国电机工程学报"]) else "国际资讯"
              for key in ["heat_score", "relevance_score", "technical_depth_score", "radar_score"]:
                  value = e.get(key)
                  if not isinstance(value, (int, float)) or not 0 <= value <= 100:
                      raise SystemExit(f"Invalid {key} for {e.get('title', '')}: {value}")

          data["event_count"] = len(data.get("events", []))
          if not data.get("daily_summary"):
              raise SystemExit("daily_summary missing")
          if "AI结构化分析失败" in data.get("quality_notes", ""):
              raise SystemExit("DeepSeek structured analysis failed")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Validated {data.get('event_count', 0)} events with scores and daily brief")
          PY

      - name: Commit results safely
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data.json /tmp/radar-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar-data.json data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update power electronics radar"
          git push origin main
