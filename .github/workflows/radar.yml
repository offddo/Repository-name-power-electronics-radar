name: Power Electronics Radar

on:
  schedule:
    # 每天北京时间 08:00 运行
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/radar.py

      - name: Commit results safely
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 保存本次生成的数据。运行期间如果 main 有新提交，先同步最新 main，
          # 再把刚生成的 data.json 放回去，避免 pull/rebase 与未提交文件冲突。
          cp data.json /tmp/radar-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar-data.json data.json

          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update power electronics radar"
          git push origin main
