name: Power Electronics Radar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Fix and improve prompt template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/radar.py")
          text = path.read_text(encoding="utf-8")
          start = text.find("    prompt = f'''", text.find("def ask_deepseek"))
          if start < 0:
              raise SystemExit("AI prompt template not found")
          text = text.replace("    prompt = f'''", "    prompt = '''", 1)
          text = text.replace("报告日期：{date}", "报告日期：DATE_PLACEHOLDER", 1)
          text = text.replace("{json.dumps(events, ensure_ascii=False)}'''", "EVENTS_PLACEHOLDER'''", 1)
          marker = "EVENTS_PLACEHOLDER'''\n\n    r = requests.post"
          replacement = "EVENTS_PLACEHOLDER'''\n    prompt = prompt.replace(\"DATE_PLACEHOLDER\", date).replace(\"EVENTS_PLACEHOLDER\", json.dumps(events, ensure_ascii=False))\n\n    r = requests.post"
          if marker not in text:
              raise SystemExit("Prompt closing marker not found")
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              "7. summary 必须短而具体，并在句首使用一个标签：[已证实]、[来源声称]、[模型推断]、[趋势判断]、[信息不足]。",
              "7. 必须分别输出 plain_summary 和 technical_summary；plain_summary 面向普通读者，用1～2句话解释发生了什么及其意义；technical_summary 面向电力电子工程师，用1～3句话说明具体技术、器件、拓扑和关键参数；两者不得复制。"
          )
          text = text.replace('"summary":"",', '"plain_summary":"","technical_summary":"",', 1)
          text = text.replace('"technical":{"voltage":"原文未提供","power":"原文未提供","topology":"原文未提供","device":"原文未提供","switching_frequency":"原文未提供","efficiency":"原文未提供","power_density":"原文未提供","isolation":"原文未提供","control":"原文未提供","application":"原文未提供"}', '"technical":{}', 1)
          text = text.replace('"industrialization":{"stage":"未知","status":"","target":""}', '"industrialization":{}', 1)
          text = text.replace('"evidence":{"confirmed_facts":[],"source_claims":[],"inferences":[],"unknowns":[]}', '"evidence":{"confirmed_facts":[],"source_claims":[],"inferences":[]}', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/radar.py

      - name: Clean and validate AI output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = {"原文未提供", "未知", "暂无数据", "N/A", "n/a", "null", "None", ""}
          def clean(v):
              if isinstance(v, dict):
                  out = {}
                  for k, x in v.items():
                      if k == "unknowns":
                          continue
                      x = clean(x)
                      if x in (None, [], {}):
                          continue
                      if isinstance(x, str) and x.strip() in forbidden:
                          continue
                      out[k] = x
                  return out
              if isinstance(v, list):
                  return [x for x in (clean(x) for x in v) if x not in (None, [], {})]
              return v
          data = clean(data)
          for e in data.get("events", []):
              sources = e.get("sources") or []
              if e.get("link") and not any(isinstance(s, dict) and s.get("link") == e.get("link") for s in sources):
                  sources.insert(0, {"source": e.get("primary_source", "原始来源"), "title": e.get("title", ""), "link": e["link"]})
              e["sources"] = sources
          if any("原文未提供" in json.dumps(e, ensure_ascii=False) for e in data.get("events", [])):
              raise SystemExit("Forbidden placeholder found")
          if "AI结构化分析失败" in data.get("quality_notes", ""):
              raise SystemExit("DeepSeek structured analysis failed")
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Validated {data.get('event_count', 0)} events")
          PY

      - name: Commit results safely
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data.json /tmp/radar-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar-data.json data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update power electronics radar"
          git push origin main
