name: Power Electronics Radar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/radar.py"
      - "scripts/radar_runner.py"
      - "scripts/radar_impl.py"
      - "scripts/source_fetcher.py"
      - "scripts/postprocess.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests googlenewsdecoder

      - name: Preserve previous history
        run: |
          if [ -f data.json ]; then
            cp data.json /tmp/radar-previous.json
          else
            printf '%s\n' '{"events":[]}' > /tmp/radar-previous.json
          fi

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/radar_runner.py
          python scripts/postprocess.py

      - name: Merge history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("data.json")
          previous_path = Path("/tmp/radar-previous.json")
          current = json.loads(current_path.read_text(encoding="utf-8"))
          previous = json.loads(previous_path.read_text(encoding="utf-8"))

          current_events = current.get("events") or []
          previous_events = previous.get("events") or []
          merged = []
          seen = set()

          def key(e):
              return str(e.get("link") or "").split("#", 1)[0].rstrip("/") or str(e.get("title") or "").strip().lower()

          for e in current_events + previous_events:
              k = key(e)
              if not k or k in seen:
                  continue
              seen.add(k)
              merged.append(e)

          merged.sort(key=lambda e: (str(e.get("published_date") or e.get("published_at") or e.get("report_date") or ""), str(e.get("id") or "")), reverse=True)
          current["events"] = merged[:2000]
          current["event_count"] = len(current["events"])
          current["history_count"] = len(previous_events)
          current["history_merged"] = True
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Merged current {len(current_events)} + previous {len(previous_events)} -> {len(current['events'])} events")
          PY

      - name: Rebuild history indexes and daily brief
        run: python scripts/postprocess.py

      - name: Clean and validate AI output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = ("AI结构化分析失败",)
          allowed_types = {"国内资讯", "国内论文", "国际资讯", "国际论文"}

          def reject(v):
              if isinstance(v, str) and any(token in v for token in forbidden):
                  return True
              if isinstance(v, list):
                  return any(reject(x) for x in v)
              if isinstance(v, dict):
                  return any(reject(x) for x in v.values())
              return False

          if reject(data.get("quality_notes", "")):
              raise SystemExit("DeepSeek structured analysis failed")
          if not data.get("daily_summary"):
              raise SystemExit("daily_summary missing")

          for e in data.get("events", []):
              if e.get("source_type") not in allowed_types:
                  raise SystemExit(f"Invalid source_type: {e.get('source_type')}")
              if not e.get("link"):
                  raise SystemExit(f"Missing original source link: {e.get('title', '')}")
              if not e.get("published_date"):
                  raise SystemExit(f"Missing published_date: {e.get('title', '')}")
              for key in ["heat_score", "relevance_score", "technical_depth_score", "radar_score"]:
                  value = e.get(key)
                  if not isinstance(value, (int, float)) or not 0 <= value <= 100:
                      raise SystemExit(f"Invalid {key} for {e.get('title', '')}: {value}")

          data["event_count"] = len(data.get("events", []))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Validated {data.get('event_count', 0)} historical events with scores and daily brief")
          PY

      - name: Commit results safely
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data.json /tmp/radar-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar-data.json data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update power electronics radar"
          git push origin main