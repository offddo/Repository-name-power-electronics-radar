<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Electronics Radar</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:16px}.hero{background:#fff;border:1px solid #e2e6eb;border-radius:16px;padding:20px;margin-bottom:14px}h1{margin:0 0 4px;font-size:25px}.sub{color:#687386;font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stat{background:#f1f3f6;border-radius:9px;padding:7px 10px;font-size:13px}.toolbar{position:sticky;top:0;z-index:5;background:#f4f6f8;padding:8px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid #d8dde5;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}.filters button.active{font-weight:700;border-color:#172033}.section{margin:16px 0}.section h2{font-size:18px;margin:10px 2px}.card{background:#fff;border:1px solid #e0e5eb;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 2px #00000008}.title{font-size:17px;font-weight:700;margin:0 0 7px}.tags span{display:inline-block;background:#eef1f5;border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0;font-size:12px}.summarybox{background:#f7f8fa;border-radius:10px;padding:10px;margin:8px 0}.summarybox h4{margin:0 0 5px;font-size:13px}.summarybox p{margin:0;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;margin-top:10px}.kv{background:#f7f8fa;border-radius:8px;padding:8px}.kv b{display:block;font-size:11px;color:#697386;margin-bottom:2px}.kv span{font-size:13px}.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.lists .box{background:#f7f8fa;border-radius:10px;padding:10px}.box h4{margin:0 0 6px;font-size:13px}.box ul{margin:0;padding-left:18px;font-size:13px}.sources{margin-top:11px}.sources a{display:inline-block;margin:3px 5px 3px 0;padding:5px 8px;border:1px solid #dce1e7;border-radius:7px;color:#26364d;text-decoration:none;font-size:12px}.empty{text-align:center;color:#687386;padding:30px}.top{border-left:4px solid #172033}.footer{text-align:center;color:#8a94a3;font-size:12px;padding:22px}
</style>
</head>
<body><div class="wrap">
<header class="hero"><h1>⚡ Power Electronics Radar</h1><div class="sub">电力电子技术情报 · RSS → 事件聚类 → DeepSeek 技术结构化</div><div id="stats" class="stats"></div></header>
<div class="toolbar"><div id="filters" class="filters"></div></div>
<main id="app"><div class="empty">正在加载今日雷达…</div></main>
<div class="footer">自动更新 · 数据文件由 GitHub Actions 每日生成</div>
</div>
<script>
let DATA=null,current='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tags(c){return (c||[]).map(x=>`<span>${esc(x)}</span>`).join('')}
function tech(t){if(!t||!Object.keys(t).length)return '';const labels={voltage:'电压',power:'功率',topology:'拓扑',device:'器件',switching_frequency:'开关频率',efficiency:'效率',power_density:'功率密度',isolation:'隔离',control:'控制',application:'应用'};const rows=Object.entries(labels).filter(([k])=>t[k]!==undefined&&t[k]!==null&&t[k]!==''&&t[k]!=='原文未提供'&&t[k]!=='未知');if(!rows.length)return '';return `<div class="grid">${rows.map(([k,a])=>`<div class="kv"><b>${a}</b><span>${esc(t[k])}</span></div>`).join('')}</div>`}
function listBox(title,arr){if(!arr||!arr.length)return '';return `<div class="box"><h4>${esc(title)}</h4><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function summaryBox(title,text){return text?`<div class="summarybox"><h4>${esc(title)}</h4><p>${esc(text)}</p></div>`:''}
function eventCard(e,i){const ev=e.evidence||{},ind=e.industrialization||{};const indRows=[['stage','产业化阶段'],['status','当前状态'],['target','目标/计划']].filter(([k])=>ind[k]&&ind[k]!=='原文未提供'&&ind[k]!=='未知');return `<article class="card ${i<3?'top':''}"><div class="title">${i<3?'🔥 ':''}${esc(e.title)}</div><div class="tags">${tags(e.category)}${e.importance?`<span>${esc(e.importance)}</span>`:''}${e.evidence_level?`<span>${esc(e.evidence_level)}</span>`:''}</div>${summaryBox('通俗版',e.plain_summary||e.summary)}${summaryBox('技术版',e.technical_summary)}${tech(e.technical)}${indRows.length?`<div class="grid">${indRows.map(([k,a])=>`<div class="kv"><b>${a}</b><span>${esc(ind[k])}</span></div>`).join('')}</div>`:''}<div class="lists">${listBox('已证实事实',ev.confirmed_facts)}${listBox('来源声称',ev.source_claims)}${listBox('模型推断',ev.inferences)}</div><div class="sources">${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">主来源：${esc(e.primary_source||'原始来源')}</a>`:''}${(e.sources||[]).filter(s=>s&&s.link).map(s=>`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.source||'来源')}</a>`).join('')}</div></article>`}
function render(){const es=(DATA.events||[]).filter(e=>current==='all'||(e.category||[]).includes(current));const dirs=DATA.directions||{};document.getElementById('stats').innerHTML=`<div class="stat">📅 ${esc(DATA.report_date)}</div><div class="stat">📌 ${es.length}/${DATA.event_count||es.length} 个事件</div><div class="stat">🔄 ${esc(DATA.updated||'')}</div>`;const dhtml=Object.entries(dirs).filter(([k,v])=>v).length?`<section class="section"><h2>🧭 技术方向</h2><div class="card">${Object.entries(dirs).filter(([k,v])=>v).map(([k,v])=>`<div class="summarybox"><b>${esc(k)}</b>：${esc(v)}</div>`).join('')}</div></section>`:'';const oh=(DATA.observations||[]).length?`<section class="section"><h2>🔎 工程观察</h2><div class="card"><ul>${DATA.observations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>`:'';document.getElementById('app').innerHTML=dhtml+oh+`<section class="section"><h2>📡 今日事件</h2>${es.length?es.map(eventCard).join(''):'<div class="empty">该分类今天没有事件。</div>'}</section>`}
function initFilters(){const set=new Set((DATA.events||[]).flatMap(e=>e.category||[]));const fs=['all',...Array.from(set).sort()];document.getElementById('filters').innerHTML=fs.map(x=>`<button data-k="${esc(x)}" class="${x==='all'?'active':''}">${x==='all'?'全部':esc(x)}</button>`).join('');document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{current=b.dataset.k;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()})}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;initFilters();render()}).catch(e=>{document.getElementById('app').innerHTML='<div class="empty">数据加载失败，请稍后刷新。</div>'});
</script></body></html>
