<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Electronics Radar</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#202124;background:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px 24px}.top{display:flex;align-items:center;gap:18px;margin-bottom:22px}.brand{font-size:25px;font-weight:500;white-space:nowrap}.brand b{color:#1a73e8}.search{flex:1;display:flex;align-items:center;border:1px solid #dfe1e5;border-radius:28px;padding:0 16px;height:46px;box-shadow:0 1px 6px #20212418}.search input{border:0;outline:0;width:100%;font-size:16px}.search span{color:#5f6368;font-size:20px}.meta{color:#5f6368;font-size:13px;margin:8px 0 14px}.tabs{display:flex;gap:20px;border-bottom:1px solid #dadce0;margin-bottom:18px;overflow:auto}.tabs button{border:0;background:none;padding:11px 4px;color:#5f6368;cursor:pointer;white-space:nowrap;font-size:14px}.tabs button.active{color:#1a73e8;border-bottom:3px solid #1a73e8}.layout{display:grid;grid-template-columns:minmax(0,760px) 270px;gap:42px}.result{padding:8px 0 22px;border-bottom:1px solid #f1f3f4}.result .url{font-size:13px;color:#188038;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result h2{font-size:20px;font-weight:500;margin:0 0 5px;line-height:1.35}.result h2 a{color:#1a0dab;text-decoration:none}.result h2 a:hover{text-decoration:underline}.snippet{font-size:14px;line-height:1.65;color:#4d5156}.badge{display:inline-block;font-size:12px;border:1px solid #dadce0;border-radius:12px;padding:2px 8px;margin:7px 5px 0 0;color:#5f6368}.summary{margin-top:9px;padding:10px 12px;background:#f8f9fa;border-radius:8px;font-size:13px;line-height:1.6}.summary b{color:#3c4043}.tech{margin-top:8px;font-size:13px;line-height:1.6;color:#3c4043}.side{border-left:1px solid #eee;padding-left:20px}.side h3{font-size:15px;font-weight:500;margin:8px 0 12px}.sidebox{border:1px solid #dadce0;border-radius:12px;padding:13px;margin-bottom:12px}.sidebox div{font-size:13px;line-height:1.6;padding:5px 0}.sidebox b{font-weight:600}.source-links{margin-top:8px}.source-links a{font-size:12px;color:#1a73e8;text-decoration:none;margin-right:12px}.source-links a:hover{text-decoration:underline}.empty{color:#5f6368;padding:35px 0}.footer{color:#70757a;text-align:center;font-size:12px;padding:30px 0}.count{color:#70757a;font-size:13px;margin-bottom:10px}@media(max-width:850px){.wrap{padding:16px}.top{display:block}.brand{margin-bottom:12px}.layout{display:block}.side{display:none}.tabs{gap:15px}.result h2{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Power</b> Electronics Radar</div>
    <div class="search"><span>⌕</span><input id="q" placeholder="搜索 SiC、GaN、GFM、PCS、DAB、CLLC、800V…"></div>
  </header>
  <div class="meta" id="meta">正在加载最新雷达…</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="layout">
    <main><div class="count" id="count"></div><section id="results"></section></main>
    <aside class="side">
      <div class="sidebox"><h3>技术方向</h3><div id="directions"></div></div>
      <div class="sidebox"><h3>雷达规则</h3><div>只保留与电力电子核心方向直接相关的内容。</div><div>国内论文与国内产业资讯单独标识。</div><div>不补写原文没有提供的技术参数。</div><div>无法定位原始来源时不伪造链接。</div></div>
    </aside>
  </div>
  <div class="footer">每日 08:00（北京时间）自动更新 · RSS / 国内期刊 / 产业资讯 → DeepSeek → data.json</div>
</div>
<script>
let DATA=null,current='全部',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeNames=['全部','国内资讯','国内论文','国际资讯','国际论文'];
function sourceLabel(e){return e.source_type||'国际资讯'}
function matches(e){if(current!=='全部'&&sourceLabel(e)!==current)return false;if(!query)return true;const s=JSON.stringify(e).toLowerCase();return s.includes(query.toLowerCase())}
function techText(t){if(!t)return '';const labels={voltage:'电压',power:'功率',topology:'拓扑',device:'器件',switching_frequency:'开关频率',efficiency:'效率',power_density:'功率密度',isolation:'隔离',control:'控制',application:'应用'};return Object.entries(labels).filter(([k])=>t[k]&&t[k]!=='原文未提供'&&t[k]!=='未知').map(([k,v])=>`${v}：${esc(t[k])}`).join('　')}
function card(e){const src=esc(e.primary_source||'来源');const link=e.link||'#';const plain=e.plain_summary||e.summary||'';const tech=e.technical_summary||'';const badges=[sourceLabel(e),...(e.category||[]),e.evidence_level].filter(Boolean);return `<article class="result"><div class="url">${esc(src)} · ${esc(link)}</div><h2><a href="${esc(link)}" target="_blank" rel="noopener">${esc(e.title)}</a></h2><div class="snippet">${esc(plain)}</div>${tech?`<div class="summary"><b>技术版：</b>${esc(tech)}</div>`:''}${techText(e.technical)?`<div class="tech">${techText(e.technical)}</div>`:''}<div>${badges.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="source-links">${(e.sources||[]).filter(s=>s&&s.link).slice(0,6).map(s=>`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.source||'来源')}</a>`).join('')}</div></article>`}
function render(){const all=(DATA.events||[]).filter(matches).sort((a,b)=>(a.importance==='重点'?0:1)-(b.importance==='重点'?0:1));document.getElementById('count').textContent=`约 ${all.length} 条强相关结果`;document.getElementById('results').innerHTML=all.length?all.map(card).join(''):'<div class="empty">没有匹配结果。可以换一个关键词或切换来源类别。</div>';document.getElementById('meta').textContent=`${DATA.report_date||''} · 更新于 ${DATA.updated||''} · 共 ${DATA.event_count||0} 条事件`}
function init(){document.getElementById('tabs').innerHTML=typeNames.map(x=>`<button class="${x===current?'active':''}" data-t="${x}">${x}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{current=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.getElementById('q').oninput=e=>{query=e.target.value.trim();render()};const dirs=DATA.directions||{};document.getElementById('directions').innerHTML=Object.entries(dirs).filter(([k,v])=>v).map(([k,v])=>`<div><b>${esc(k)}</b><br>${esc(v)}</div>`).join('')||'<div>暂无</div>';render()}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;init()}).catch(()=>{document.getElementById('results').innerHTML='<div class="empty">数据加载失败，请刷新页面。</div>'});
</script>
</body>
</html>
